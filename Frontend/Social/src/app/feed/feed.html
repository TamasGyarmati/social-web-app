<div class="header">
  <h1>Welcome to <i>Social</i></h1>
  <h4>Share your moments, connect with others</h4>
</div>

<mat-progress-spinner mode="indeterminate" *ngIf="this.isLoading()"></mat-progress-spinner>

<div class="create-post-button">
  <button matButton *ngIf="!this.isLoading()" [routerLink]="['/create-post']">Create post</button>
</div>

<div class="filter-buttons" *ngIf="this.auth.isLoggedIn()">
  <div class="filter-button">
    <button
      matButton
      [class.active]="isFiltered()"
      (click)="toggleFilterByMe()"
      *ngIf="!this.isLoading()"
    >
      Filter by me
    </button>
  </div>
  <div class="filter-button">
    <button
      matButton
      [class.active]="isDateDescending()"
      (click)="toggleFilterByDate()"
      *ngIf="!this.isLoading()"
    >
      Filter by date
    </button>
  </div>
</div>

<div class="feed-container" *ngIf="!this.isLoading()">
  <div class="feed-card" *ngFor="let post of this.currentPosts()">
    <div class="feed-top-row">
      <div class="feed-user-data" [routerLink]="['/user', post.creatorById]">
        <img class="avatar" [src]="this.apiUri + '/' + post.creatorAvatarUrl" />
        <div class="feed-user-info">
          <h2>@{{ post.creatorUserName }}</h2>
          <h3 style="font-size: 15px">{{ getDayCount(post) }}</h3>
        </div>
      </div>
      <div class="feed-actions">
        <button
          id="edit-button"
          matButton="elevated"
          *ngIf="post.creatorById === this.auth.user()?.id"
          (click)="openEditDialog('300ms', '0ms', post)"
        >
          <mat-icon>edit</mat-icon>
        </button>
        <button
          id="delete-button"
          matButton="elevated"
          *ngIf="post.creatorById === this.auth.user()?.id"
          (click)="openDeleteDialog('300ms', '150ms', post)"
        >
          <mat-icon>delete</mat-icon>
        </button>
      </div>
    </div>
    <div class="feed-image" *ngIf="post.imageUrl !== null">
      <img class="post" [src]="this.apiUri + '/' + post.imageUrl" />
    </div>
    <div class="feed-content">
      <h1>{{ post.title }}</h1>
      <p>{{ post.description }}</p>
    </div>
    <div class="feed-data">
      <div class="data" (click)="likePost(post.id)">
        <mat-icon [class.liked]="post.isLiked">favorite</mat-icon>
        <p>{{ post.likes }}</p>
      </div>
      <div class="data" (click)="getComments(post.id)">
        <mat-icon>comment</mat-icon>
        <p>{{ post.commentsCount }}</p>
      </div>
    </div>

    <app-comments
      *ngIf="openedComments().has(post.id)"
      [postId]="post.id"
      [comments]="comments().get(post.id) || []"
      (commentCreated)="addComment(post.id, $event)"
      (commentLiked)="onCommentLiked($event)"
      (replyCreated)="onReplyCreated($event)"
    >
    </app-comments>
  </div>
</div>
