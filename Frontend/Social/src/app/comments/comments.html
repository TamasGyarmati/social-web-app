<div class="comments">
  <div class="comment-input">
    <form (ngSubmit)="createComment()">
      <mat-form-field appearance="outline">
        <mat-label>Write a comment...</mat-label>
        <mat-icon matPrefix>chat_bubble_outline</mat-icon>
        <input
          [(ngModel)]="this.commentContent"
          name="commentContent"
          matInput
          type="text"
          placeholder="Write a comment..."
        />
        <button mat-icon-button matSuffix type="button" aria-label="Post comment">
          <mat-icon>send</mat-icon>
        </button>
      </mat-form-field>
    </form>
  </div>

  <h3>Comments</h3>

  <app-comment-item
    *ngFor="let comment of getRootItems()"
    [comment]="comment"
    [allComments]="comments()"
    [activeReplyCommentId]="activeReplyCommentId()"
    (replyCreated)="onReplyCreated($event)"
    (replyClicked)="onReplyClicked($event)"
    (commentLiked)="onCommentLiked($event)"
  >
  </app-comment-item>
</div>
