<div class="user-page">
  <h1>User Profile</h1>

  <mat-progress-spinner mode="indeterminate" *ngIf="isLoading()"></mat-progress-spinner>

  <ng-container *ngIf="!isLoading() && user() as currentUser">
    <div class="profile-card">
      <div class="profile-header">
        <div class="avatar-container">
          <img
            class="profile-avatar"
            [src]="
              currentUser.avatarUrl ? apiUri + currentUser.avatarUrl : 'assets/default-avatar.png'
            "
            [alt]="currentUser.userName + ' avatar'"
          />
        </div>

        <div class="profile-info">
          <div class="name-row">
            <h2>{{ currentUser.firstName }} {{ currentUser.lastName }}</h2>

            <span *ngIf="isFollowingMe() === true" class="follow-status follows-you">
              <mat-icon>person_check</mat-icon>
              Follows you
            </span>

            <span *ngIf="isFollowingMe() === false" class="follow-status not-following">
              <mat-icon>person_outline</mat-icon>
              Doesn't follow you
            </span>
          </div>

          <p class="username">@{{ currentUser.userName }}</p>

          <p class="email">
            <mat-icon>mail_outline</mat-icon>
            {{ currentUser.email }}
          </p>
        </div>

        <button
          mat-flat-button
          type="button"
          class="manage-account-button"
          [routerLink]="['/user-handling']"
          *ngIf="currentUser.id === this.auth.user()?.id"
        >
          <mat-icon> manage </mat-icon>

          <span> Manage account </span>
        </button>

        <button
          mat-flat-button
          type="button"
          class="follow-button"
          [class.unfollow-button]="isFollowing() === true"
          (click)="followUser()"
          *ngIf="currentUser.id !== this.auth.user()?.id"
        >
          <mat-icon>
            {{ isFollowing() ? 'person_remove' : 'person_add' }}
          </mat-icon>

          <span>
            {{ isFollowing() ? 'Unfollow' : 'Follow' }}
          </span>
        </button>
      </div>

      <!-- Divider -->
      <div class="divider"></div>

      <!-- Statistics -->
      <div class="profile-stats">
        <button
          type="button"
          class="stat"
          aria-label="View followers"
          (click)="openDialog('followers', '300ms', '150ms')"
        >
          <span class="stat-value">{{ currentUser.followerCount }}</span>
          <span class="stat-label">Followers</span>
        </button>

        <div class="stat-divider"></div>

        <button
          type="button"
          class="stat"
          aria-label="View following"
          (click)="openDialog('following', '300ms', '150ms')"
        >
          <span class="stat-value">{{ currentUser.followingCount }}</span>
          <span class="stat-label">Following</span>
        </button>
      </div>
    </div>
  </ng-container>
</div>
