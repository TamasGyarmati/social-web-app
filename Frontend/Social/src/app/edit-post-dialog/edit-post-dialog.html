<div class="edit-dialog">
  <h1>Edit Post</h1>

  <mat-progress-spinner mode="indeterminate" *ngIf="this.isLoading()"></mat-progress-spinner>

  <form [formGroup]="editPostForm" *ngIf="!this.isLoading()" (ngSubmit)="updatePost()">
    <mat-form-field appearance="outline">
      <mat-label>Title</mat-label>
      <input matInput formControlName="title" />
      <mat-icon matSuffix>text_fields</mat-icon>
      <mat-hint>Title of the post</mat-hint>
      <mat-error>You must fill out the title!</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="description"></textarea>
      <mat-icon matSuffix>text_fields</mat-icon>
      <mat-hint>Description of the post</mat-hint>
      <mat-error>You must fill out the description!</mat-error>
    </mat-form-field>

    <div class="file-input">
      <label for="image">
        <mat-icon>image</mat-icon>
        <span>Choose an image</span>
      </label>

      <input id="image" type="file" accept="image/*" (change)="onImageSelected($event)" />

      <span class="selected-file" *ngIf="selectedFileName">
        {{ selectedFileName }}
      </span>
    </div>

    <div class="edit-button">
      <button type="submit" mat-flat-button color="accent" class="edit-button">Edit</button>
    </div>
  </form>
</div>
